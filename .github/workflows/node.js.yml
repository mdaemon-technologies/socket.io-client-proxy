# Builds the package and tests it across every supported version of node.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
#
# The package supports Node 18 and later, but the toolchain does not: Vitest
# needs Node 22.12 and jsdom needs 22.22.2 (or 24.15.0 on Node 24). So the full
# suite runs where the toolchain does, and the bundles built on the Active LTS
# (the same Node version publish.yml uses) are smoke-tested on the older versions
# with nothing but node:test and the package's runtime dependencies.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/previous-releases

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run typecheck
    - run: npm test
    - run: npm run test:smoke
    - run: npm audit --omit=dev --audit-level=high
    - name: Keep the bundles for the older Node versions
      if: matrix.node-version == '26.x'
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # The bundles built and tested above, replacing the committed ones, which
    # may be stale on a pull request.
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # Runtime dependencies only: the bundles import socket.io-client, and the
    # dev toolchain cannot run on these versions.
    - run: npm ci --omit=dev --ignore-scripts
    - run: npm run test:smoke
